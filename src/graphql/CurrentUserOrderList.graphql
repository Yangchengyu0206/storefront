query CurrentUserOrderList($first: Int, $after: String, $last: Int, $before: String) {
	me {
		...UserDetails
		orders(first: $first, after: $after, last: $last, before: $before) {
			edges {
				node {
					...OrderDetails
				}
			}
			pageInfo {
				hasNextPage
				hasPreviousPage
				startCursor
				endCursor
			}
		}
	}
}
